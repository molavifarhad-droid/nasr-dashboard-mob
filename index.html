<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>داشبورد بازاریابی و فروش فولاد نصر آذربایجان</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0f1b2d">
<link rel="apple-touch-icon" href="/static/pwa/icons/icon-192.png">
<style>
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:#0f1b2d; color:#f4f6f9; font-family: Tahoma, "Segoe UI", sans-serif; }
  .box { text-align:center; max-width: 380px; padding: 24px; }
  .spinner { width:42px; height:42px; margin:0 auto 18px; border-radius:50%;
             border:4px solid #24405f; border-top-color:#33c481; animation:spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  h1 { font-size:16px; margin:0 0 8px; }
  p { font-size:13px; color:#8ba0b8; line-height:1.9; margin:4px 0; }
  .err { color:#e5484d; display:none; margin-top:14px; }
</style>
</head>
<body>
  <div class="box">
    <div class="spinner"></div>
    <h1 id="statusTitle">در حال آماده‌سازی برنامه برای اولین بار…</h1>
    <p id="statusDetail">در حال دانلود و راه‌اندازی داشبورد (حدود ۱۷ مگابایت، فقط همین یک‌بار). لطفاً تا پایان به اینترنت متصل بمانید و این صفحه را نبندید.</p>
    <p class="err" id="errBox"></p>
  </div>
<script>
async function boot() {
  if (!("serviceWorker" in navigator)) {
    document.getElementById("errBox").style.display = "block";
    document.getElementById("errBox").textContent =
      "مرورگر شما از این نوع برنامه پشتیبانی نمی‌کند. لطفاً از آخرین نسخه Chrome یا Edge استفاده کنید.";
    return;
  }
  try {
    const reg = await navigator.serviceWorker.register("/sw.js");
    if (navigator.serviceWorker.controller) {
      location.replace("/");
      return;
    }
    document.getElementById("statusDetail").textContent =
      "در حال آماده‌سازی موتور برنامه… این مرحله فقط در اولین اجرا زمان می‌برد.";
    navigator.serviceWorker.addEventListener("controllerchange", () => location.replace("/"));
    await navigator.serviceWorker.ready;
    if (navigator.serviceWorker.controller) location.replace("/");
  } catch (err) {
    document.getElementById("errBox").style.display = "block";
    document.getElementById("errBox").textContent = "خطا در راه‌اندازی: " + err;
  }
}
boot();
</script>
</body>
</html>
